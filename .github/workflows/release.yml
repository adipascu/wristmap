name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install platform 37
        run: yes | sdkmanager "platforms;android-37.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
            echo "KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build companion
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease testDebugUnitTest --no-daemon
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pebble-tool
        run: |
          sudo apt-get update && sudo apt-get install -y libpng-dev
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" tool install pebble-tool --python 3.13
      - name: Build watchapp
        working-directory: watchapp
        run: |
          pebble sdk install latest || true
          pebble build
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/wristmap.apk
          cp watchapp/build/watchapp.pbw dist/wristmap.pbw
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
